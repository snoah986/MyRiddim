[package]
name = "ytm-player"
version = "1.0.0"
description = "Local YouTube Music player (Svelte + Flask)"
authors = ["ytm-player"]
edition = "2021"

[lib]
name = "ytm_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
