<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>myriddim Remote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="myriddim">
  <link rel="manifest" href="/mobile-manifest.webmanifest">
  <link rel="apple-touch-icon" href="/mobile-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#0d0b0a; --surface:#17110f; --card:#1c1512; --paper:#f2ece4; --muted:#a99b8f; --muted2:#7a6d64; --line:#ffffff16; --safe-top:max(env(safe-area-inset-top), 18px); --safe-bottom:max(env(safe-area-inset-bottom), 18px); }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); }
    body { min-height:100svh; overflow:hidden; color:var(--paper); font-family:Manrope,system-ui,sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
    button,input { font:inherit; }
    button { border:0; color:inherit; cursor:pointer; }
    .app { position:relative; display:flex; flex-direction:column; min-height:100svh; overflow:hidden; background:radial-gradient(circle at 50% -8%,#f2ece41a,transparent 46%),var(--bg); }
    .app:before { content:""; position:absolute; inset:-30%; z-index:0; pointer-events:none; background:radial-gradient(circle at 40% 22%,var(--glow,#f2ece41a),transparent 32%); opacity:.55; filter:blur(70px); }
    .topbar,.main,.dock { position:relative; z-index:1; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:var(--safe-top) 20px 10px; }
    .brand { font:400 22px Anton,sans-serif; letter-spacing:.02em; }
    .connection { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; }
    .connection i { width:7px; height:7px; border-radius:50%; background:#f87171; }.connection.online i { background:#34d399; box-shadow:0 0 12px #34d399; }
    .top-actions { display:flex; gap:8px; }.icon { display:grid; place-items:center; width:36px; height:36px; border:1px solid var(--line); border-radius:50%; color:var(--muted); background:#ffffff0a; }.icon.active { color:#111; background:var(--paper); }
    .main { display:flex; flex:1; min-height:0; flex-direction:column; align-items:center; justify-content:center; gap:0; padding:10px 24px 16px; }
    .art-wrap { width:min(78vw,340px); aspect-ratio:1; overflow:hidden; border:1px solid var(--line); border-radius:28px; background:var(--surface); box-shadow:0 28px 80px #000b; }.art-wrap img { width:100%; height:100%; object-fit:cover; }.art-wrap.empty { display:grid; place-items:center; color:var(--muted); font-size:5rem; }
    .meta { width:min(100%,390px); margin-top:22px; text-align:center; }.meta h1 { overflow:hidden; margin:0; font:400 clamp(24px,7vw,34px)/1.05 Anton,sans-serif; text-overflow:ellipsis; white-space:nowrap; }.meta p { overflow:hidden; margin:8px 0 0; color:var(--muted); font-size:14px; text-overflow:ellipsis; white-space:nowrap; }.meta small { display:block; margin-top:4px; color:var(--muted2); font-size:11px; }
    .dock { padding:0 20px var(--safe-bottom); }.volume { display:flex; align-items:center; gap:8px; margin:0 auto 12px; width:min(100%,390px); color:var(--muted2); font-size:10px; }.volume input { flex:1; min-width:0; accent-color:var(--paper); }.scrubber { display:flex; align-items:center; gap:10px; color:var(--muted2); font-size:10px; font-variant-numeric:tabular-nums; }.scrubber input { flex:1; min-width:0; accent-color:var(--paper); }    .controls { display:flex; align-items:center; justify-content:space-between; margin:14px auto 16px; width:min(100%,390px); }.control { display:grid; place-items:center; width:40px; height:40px; border:1px solid var(--line); border-radius:50%; color:var(--muted); background:#ffffff0a; transition:transform .2s ease,background .2s ease; }.control:active { transform:scale(.9); }.control.skip { width:48px; height:48px; color:var(--paper); }.control.play { width:62px; height:62px; color:#111; background:var(--paper); box-shadow:0 10px 28px #0009; }    .control svg { width:18px; height:18px; }.control.play svg { width:24px; height:24px; }.control.party-skip { display:none; width:auto; min-width:58px; padding:0 10px; border-radius:999px; color:var(--paper); font-size:10px; font-weight:700; }.control.party-skip.visible { display:grid; }.control.party-skip.voted { color:#111; background:var(--paper); }
    .tabs { display:flex; justify-content:center; gap:4px; padding:4px; border:1px solid var(--line); border-radius:999px; background:#ffffff08; }.tabs button { padding:8px 15px; border-radius:999px; color:var(--muted); background:transparent; font-size:11px; font-weight:700; }.tabs button.active { color:#111; background:var(--paper); }
    .drawer { position:fixed; inset:auto 0 0; z-index:5; display:flex; height:min(78svh,680px); flex-direction:column; padding:10px 20px var(--safe-bottom); border-top:1px solid var(--line); border-radius:30px 30px 0 0; background:#17110ff5; box-shadow:0 -24px 70px #000b; backdrop-filter:blur(25px); transform:translateY(105%); transition:transform .35s cubic-bezier(.2,.8,.2,1); }.drawer.open { transform:translateY(0); }.handle { width:46px; height:4px; margin:0 auto 16px; border-radius:99px; background:#ffffff33; }.drawer-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }.drawer-head h2 { margin:0; font:400 24px Anton,sans-serif; }.done { padding:8px 13px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:#ffffff0a; font-size:11px; }.drawer-body { flex:1; min-height:0; overflow:auto; padding-bottom:12px; }.lyrics-line { display:block; width:100%; padding:9px 0; color:#ffffff55; background:none; text-align:center; font-size:20px; font-weight:700; }.lyrics-line.active { color:var(--paper); }.queue-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #ffffff0d; }.queue-row img { width:44px; height:44px; border-radius:10px; object-fit:cover; }.queue-row div { min-width:0; }.queue-row strong,.queue-row span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.queue-row span { margin-top:3px; color:var(--muted); font-size:11px; }.search-form { display:flex; gap:8px; margin-bottom:14px; }.search-form input { flex:1; min-width:0; padding:12px 14px; border:1px solid var(--line); border-radius:999px; outline:none; color:var(--paper); background:#ffffff0a; }.search-form button { padding:0 16px; border-radius:999px; color:#111; background:var(--paper); font-size:12px; font-weight:700; }.search-result { display:flex; align-items:center; gap:10px; width:100%; padding:9px 0; border-bottom:1px solid #ffffff0d; background:none; text-align:left; }.search-result img { width:44px; height:44px; border-radius:10px; object-fit:cover; }.search-result span { min-width:0; }.search-result strong,.search-result small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.search-result small { margin-top:3px; color:var(--muted); }.empty { padding:28px 8px; color:var(--muted); text-align:center; font-size:13px; }    .toast { position:fixed; left:50%; bottom:calc(var(--safe-bottom) + 100px); z-index:10; max-width:calc(100% - 40px); padding:10px 14px; border:1px solid var(--line); border-radius:999px; background:#000c; transform:translateX(-50%); font-size:11px; }
    .join-overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:#0d0b0af2; backdrop-filter:blur(8px); }
    .join-card { width:min(86vw,340px); padding:26px; border:1px solid var(--line); border-radius:24px; background:var(--surface); text-align:center; }
    .join-card h2 { margin:0; font:400 24px Anton,sans-serif; }
    .join-card p { margin:8px 0 18px; color:var(--muted); font:600 13px ui-monospace,monospace; letter-spacing:.14em; }
    .join-card input { width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid var(--line); border-radius:999px; outline:none; color:var(--paper); background:#ffffff0a; text-align:center; }
    .join-card button { display:block; width:100%; margin-top:12px; padding:12px 0; border-radius:999px; color:#111; background:var(--paper); font-weight:700; }
    .party-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .party-head .room { color:var(--paper); font:700 13px ui-monospace,monospace; letter-spacing:.14em; }
    .cooldown-ring { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:conic-gradient(var(--paper) calc((1 - var(--cd,0)/30) * 360deg), #ffffff22 0); color:var(--muted); font:700 10px ui-monospace,monospace; }
    .cooldown-ring.idle { background:#ffffff0f; }
    .cooldown-ring.idle::after { content:'\2713'; font-size:13px; }
    .party-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #ffffff0d; }
    .party-row img { width:44px; height:44px; border-radius:10px; object-fit:cover; }
    .party-row div { min-width:0; flex:1; }
    .party-row strong,.party-row small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .party-row small { margin-top:3px; color:var(--muted); font-size:11px; }
    .party-row .who { color:var(--muted2); }
    .vote { flex:0 0 auto; display:flex; align-items:center; gap:4px; padding:7px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:#ffffff0a; font-size:11px; font-weight:700; }
    .vote.voted { color:#111; background:var(--paper); }
    .party-status { padding:10px 12px; margin-bottom:12px; border:1px solid var(--line); border-radius:14px; color:var(--muted); font-size:12px; }
    .party-status b { color:var(--paper); }.party-options { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 12px; color:var(--muted); font-size:11px; }.party-options label { display:flex; align-items:center; gap:7px; }.party-options input { accent-color:var(--paper); }.party-skip-status { margin-top:6px; color:var(--muted2); font-size:10px; }
    .search-result.added { opacity:.55; }
    @media (min-width:700px) { .app { width:430px; min-height:100vh; margin:auto; border-right:1px solid var(--line); border-left:1px solid var(--line); } }
  </style>
</head>
<body>
  <div id="connection-error" style="display:none; padding:24px; text-align:center; color:#fff; font-family:sans-serif;">
    <h2>Unable to connect to host</h2>
    <p style="color:#aaa; font-size:14px;">If you are on campus/university Wi-Fi, connect both devices to a mobile hotspot to bypass network client isolation.</p>
    <button onclick="location.reload()" style="margin-top:16px; padding:10px 20px; border-radius:20px; background:#fff; color:#000; border:none; font-weight:bold;">Retry</button>
  </div>
  <div class="app">
    <header class="topbar"><div class="brand">myriddim</div><div id="connection" class="connection"><i></i><span>Connecting…</span></div><div class="top-actions"><button class="icon" id="lyrics-btn" aria-label="Open lyrics">♫</button><button class="icon" id="queue-btn" aria-label="Open queue">☷</button></div></header>
    <main class="main"><div id="art-wrap" class="art-wrap empty">♫</div><div class="meta"><h1 id="title">No track playing</h1><p id="artist">Connect your desktop player</p><small id="album"></small></div></main>
    <footer class="dock"><div class="scrubber"><span id="current">0:00</span><input id="seek" type="range" min="0" max="0" step=".1" value="0" aria-label="Seek"><span id="duration">0:00</span></div><div class="controls"><button class="control" id="shuffle" aria-label="Toggle shuffle">⇄</button><button class="control skip" id="previous" aria-label="Previous track">|◀</button><button class="control play" id="play" aria-label="Play">▶</button><button class="control skip" id="next" aria-label="Next track">▶|</button><button class="control" id="repeat" aria-label="Toggle repeat">↻</button><button class="control party-skip" id="party-skip" aria-label="Vote to skip">Skip</button></div><label class="volume"><span>Volume</span><input id="volume" type="range" min="0" max="1" step=".01" value="1" aria-label="Volume"></label><nav class="tabs"><button class="active" data-tab="player">Now playing</button><button data-tab="search">Search</button><button data-tab="party" id="party-tab" hidden>Party</button></nav></footer>
    <section class="drawer" id="drawer" aria-label="Remote drawer"><div class="handle"></div><div class="drawer-head"><h2 id="drawer-title">Queue</h2><button class="done" id="drawer-close">Done</button></div><div class="drawer-body" id="drawer-body"></div></section>
    <div class="join-overlay" id="join-overlay" hidden><div class="join-card"><h2>Join the party</h2><p id="join-room"></p><input id="join-name" placeholder="Your name" maxlength="24" autocomplete="off"><button id="join-go">Join</button></div></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <script>
    let base = localStorage.getItem('myriddim.remoteBase') || `${location.protocol}//${location.host}`;
    let state = { current_track:null, is_playing:false, current_time:0, duration:0, volume:1, queue:[], lyrics:[] };
    let activeDrawer = null, pollTimer, toastTimer, lyricsFor = null, lyricsLoading = false, lyricsRequest = 0, searchRequest = 0, syncRequest = 0, commandChain = Promise.resolve(), seekTimer, pendingSeek = null, isSeeking = false, booted = false;
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const time = (value) => { const n=Number(value); if (!Number.isFinite(n)) return '0:00'; return `${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`; };
    function showToast(message) { $('toast').textContent=message; $('toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').hidden=true,2600); }
    function showConnectionError() { const box=document.getElementById('connection-error'); if (box) box.style.display='block'; const badge=$('connection'); if (badge) badge.classList.remove('online'); }
    function hideConnectionError() { const box=document.getElementById('connection-error'); if (box) box.style.display='none'; }
    async function request(path, options) { const response=await fetch(`${base}${path}`,options); if (!response.ok) throw Error(`Request failed (${response.status})`); return response.json(); }
    function render() {
      const track=state.current_track || {}; const art=$('art-wrap');
      $('title').textContent=track.title || 'No track playing'; $('artist').textContent=track.artist || 'Connect your desktop player'; $('album').textContent=track.album || '';
      art.classList.toggle('empty', !track.thumbnail); art.innerHTML=track.thumbnail ? `<img src="${escapeHtml(track.thumbnail)}" alt="">` : '♫';
      $('current').textContent=time(state.current_time); $('duration').textContent=time(state.duration); $('seek').max=state.duration || 0; if(!isSeeking) $('seek').value=Math.min(state.current_time || 0,state.duration || 0); $('volume').value=state.volume ?? 1; $('play').innerHTML=state.is_playing ? '❚❚' : '▶'; $('play').ariaLabel=state.is_playing ? 'Pause' : 'Play'; $('shuffle').classList.toggle('active', !!state.shuffle); $('repeat').classList.toggle('active', state.repeat && state.repeat !== 'off');
      $('connection').classList.add('online'); $('connection').querySelector('span').textContent='Connected';
      const skipButton = $('party-skip');
      if (skipButton) { skipButton.classList.toggle('visible', partyActive()); skipButton.classList.toggle('voted', partySkipVoted); skipButton.textContent = partySkipVoted ? 'Voted' : 'Skip'; }
      document.documentElement.style.setProperty('--glow', state.current_track?.palette?.ambient || '#f2ece41a');
      if (activeDrawer==='queue') renderQueue(); if (activeDrawer==='lyrics') { if (lyricsFor !== (track.videoId || track.id)) loadLyrics(track); else renderLyrics(); }
    }
    async function sync() {
      const requestId=++syncRequest;
      try {
        const data=await request('/api/remote/state');
        if(requestId!==syncRequest) return;
        state={...state,...data}; booted = true; hideConnectionError(); render();
      } catch {
        if(requestId!==syncRequest) return;
        $('connection').classList.remove('online'); $('connection').querySelector('span').textContent='Offline';
        if (!booted) showConnectionError();
      }
    }
    function send(action,payload=null,refresh=true) {
      commandChain = commandChain.then(async () => {
        try { await request('/api/remote/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload})}); if(refresh) await sync(); }
        catch { showToast('Desktop player is unreachable'); }
      });
      return commandChain;
    }
    function beginSeek() { isSeeking=true; }
    function scheduleSeek(value) {
      pendingSeek=Number(value);
      clearTimeout(seekTimer);
      seekTimer = setTimeout(() => { if(pendingSeek!==null) { const value=pendingSeek; pendingSeek=null; send('seek', value); } }, 80);
    }
    function endSeek() {
      isSeeking=false;
      clearTimeout(seekTimer);
      if(pendingSeek!==null) { const value=pendingSeek; pendingSeek=null; send('seek', value); }
    }
    function openDrawer(type) {
      if(activeDrawer===type) type=null;
      activeDrawer=type; $('drawer').classList.toggle('open',!!type);
      if(type!=='lyrics') { lyricsRequest++; lyricsLoading=false; }
      if(!type) return;
      $('drawer-title').textContent=type==='lyrics'?'Synced Lyrics':type==='search'?'Search':type==='party'?'Party Queue':'Up Next';
      if(type==='lyrics') { lyricsFor=null; loadLyrics(state.current_track); }
      else if(type==='queue') renderQueue(); else if(type==='party') renderParty(); else if(partyActive()) renderPartySearchView(); else renderSearch();
    }
    function renderQueue() { const items=state.queue||[]; $('drawer-body').innerHTML=items.length ? items.map(item=>`<button class="queue-row" data-id="${escapeHtml(item.videoId||item.id)}"><img src="${escapeHtml(item.thumbnail||'')}" alt=""><div><strong>${escapeHtml(item.title||'Untitled')}</strong><span>${escapeHtml(item.artist||'')}</span></div></button>`).join('') : '<div class="empty">Your queue is empty.</div>'; [...document.querySelectorAll('.queue-row')].forEach((button)=>button.addEventListener('click',()=>{const item=items.find(track=>(track.videoId||track.id)===button.dataset.id); if(item) send('play_track',item); })); }
    function renderPartySearchView() {
      const body = $('drawer-body');
      if (!partyActive()) { body.innerHTML = '<div class="empty">Join a party to request songs.</div>'; return; }
      body.innerHTML = '<form class="search-form" id="party-search-form"><input id="party-search-input" placeholder="Search YouTube Music" autocomplete="off"><button>Search</button></form><div class="party-options"><label><input type="checkbox" id="party-play-next"> Request as Play Next</label><span>Host approval may still apply</span></div><div id="party-results"></div>';
      document.getElementById('party-search-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const query = document.getElementById('party-search-input').value.trim(); if (!query) return;
        const searchId = ++searchRequest; document.getElementById('party-results').innerHTML = '<div class="empty">Searching…</div>';
        try {
          const data = await request('/api/search?q=' + encodeURIComponent(query));
          if (searchId !== searchRequest || activeDrawer !== 'party') return;
          window.__partySearchResults = (data.songs || data.results || []).slice(0, 20);
          partyPlayNext = !!document.getElementById('party-play-next')?.checked;
          window.__partyAdded = window.__partyAdded || [];
          renderPartySearch(window.__partySearchResults, window.__partyAdded);
        } catch { if (searchId === searchRequest) document.getElementById('party-results').innerHTML = '<div class="empty">Search unavailable.</div>'; }
      });
    }
    function renderLyrics() { const lines=state.lyrics||[]; $('drawer-body').innerHTML=lines.length ? lines.map(line=>`<div class="lyrics-line ${Number(line.time)<=Number(state.current_time)?'active':''}">${escapeHtml(line.text)}</div>`).join('') : (lyricsLoading ? '<div class="empty">Loading lyrics…</div>' : '<div class="empty">Lyrics are unavailable for this track.</div>'); }
    async function loadLyrics(track) {
      const id=track?.videoId||track?.id; if(!id) { lyricsLoading=false; lyricsFor=null; state.lyrics=[]; renderLyrics(); return; }
      const requestId=++lyricsRequest; lyricsLoading=true; lyricsFor=id; state.lyrics=[]; renderLyrics();
      try {
        const params=new URLSearchParams({track_id:id,title:track.title||'',artist:track.artist||'',duration:String(state.duration||'')}); const data=await request('/api/lyrics?'+params);
        if(requestId===lyricsRequest && (state.current_track?.videoId||state.current_track?.id)===id) state.lyrics=data.lines||[];
      } catch { if(requestId===lyricsRequest) state.lyrics=[]; }
      finally { if(requestId===lyricsRequest) { lyricsLoading=false; if(activeDrawer==='lyrics') renderLyrics(); } }
    }
    async function renderSearch() {
      searchRequest++;
      $('drawer-body').innerHTML='<form class="search-form" id="search-form"><input id="search-input" placeholder="Search YouTube Music" autocomplete="off"><button>Search</button></form><div id="search-results"></div>';
      $('search-form').addEventListener('submit',async(event)=>{
        event.preventDefault(); const query=$('search-input').value.trim(); if(!query)return;
        const searchId=++searchRequest; $('search-results').innerHTML='<div class="empty">Searching…</div>';
        try {
          const data=await request('/api/search?q='+encodeURIComponent(query));
          if(searchId!==searchRequest || activeDrawer!=='search') return;
          const results=(data.songs||data.results||[]).slice(0,20); $('search-results').innerHTML=results.length ? results.map(item=>`<button class="search-result" data-id="${escapeHtml(item.videoId||item.id)}"><img src="${escapeHtml(item.thumbnail||'')}" alt=""><span><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.artist||'')}</small></span></button>`).join('') : '<div class="empty">No songs found.</div>';
          [...document.querySelectorAll('.search-result')].forEach((button)=>button.addEventListener('click',()=>{const item=results.find(track=>(track.videoId||track.id)===button.dataset.id); if(item) { send('play_track',item); openDrawer(null); }}));
        } catch { if(searchId===searchRequest && activeDrawer==='search') $('search-results').innerHTML='<div class="empty">Search unavailable.</div>'; }
      });
    }
    // Wire the UI and start the poll loop. Any initialization exception, a
    // failed first fetch, or a 4-second silent timeout surfaces the visible
    // fallback instead of leaving a blank page.
    try {
      $('play').onclick=()=>send('toggle_play'); $('previous').onclick=()=>send('previous'); $('next').onclick=()=>send('next'); $('shuffle').onclick=()=>send('toggle_shuffle'); $('repeat').onclick=()=>send('toggle_repeat'); $('party-skip').onclick=voteSkip; $('lyrics-btn').onclick=()=>openDrawer('lyrics'); $('queue-btn').onclick=()=>openDrawer('queue'); $('drawer-close').onclick=()=>openDrawer(null); $('seek').onpointerdown=beginSeek; $('seek').ontouchstart=beginSeek; $('seek').oninput=()=>scheduleSeek($('seek').value); $('seek').onpointerup=endSeek; $('seek').ontouchend=endSeek; $('seek').onchange=endSeek; $('volume').oninput=()=>send('set_volume',Number($('volume').value)); document.querySelectorAll('[data-tab]').forEach((button)=>button.onclick=()=>button.dataset.tab==='search'?openDrawer('search'):button.dataset.tab==='party'?openDrawer('party'):openDrawer(null));
      sync(); pollTimer=setInterval(sync,1000); window.addEventListener('pagehide',()=>{ clearInterval(pollTimer); clearInterval(partyTimer); clearTimeout(seekTimer); clearTimeout(toastTimer); });
      if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/mobile-sw.js',{scope:'/mobile'}).catch(()=>{}));
      // If the host never answers within 4 seconds, surface the fallback;
      // later successful syncs hide it again.
      setTimeout(() => { if (!booted) showConnectionError(); }, 4000);
    } catch (error) { showConnectionError(); }

    // --- Party Mode (guest) ----------------------------------------------
    // Same host API, guest role: join by room code, request tracks from the
    // search results (subject to cooldown + quota + optional approval), and
    // upvote queued requests when democratic upvoting is on. Transport stays
    // host-only; the party tab replaces the remote controls while active.
    let party = null, partyGuest = null, partyTimer = null, partyCooldown = 0, partyCooldownTick = null, partyVoted = new Set(), partyPlayNext = false, partySkipVoted = false, partySkipFor = null;
    function partyParams() { const params=new URLSearchParams(location.search); return (params.get('party')||'').toUpperCase(); }
    function partyActive() { return !!(party && party.active && partyGuest); }
    function setCooldown(seconds) {
      partyCooldown = Math.max(0, Number(seconds)||0);
      const ring = document.getElementById('cd-ring');
      if (!ring) return;
      if (partyCooldown > 0) { ring.classList.remove('idle'); ring.textContent = partyCooldown; ring.style.setProperty('--cd', partyCooldown); }
      else { ring.classList.add('idle'); ring.textContent = ''; }
    }
    function tickCooldown() {
      if (partyCooldown <= 0) { clearInterval(partyCooldownTick); partyCooldownTick = null; setCooldown(0); return; }
      setCooldown(partyCooldown - 1);
    }
    function startCooldown(seconds) { setCooldown(seconds||30); if (!partyCooldownTick) partyCooldownTick = setInterval(tickCooldown, 1000); }
    function renderParty() {
      const body = document.getElementById('drawer-body');
      if (!body) return;
      if (!partyActive()) { body.innerHTML = '<div class="empty">Party is not active. Open the invite link or enter a room code.</div>'; return; }
      const quota = party.quota, used = party.unplayed_count || 0;
      const quotaText = quota ? `Requests left this round: <b>${Math.max(0, quota - used)}</b> / ${quota}` : 'No request limit';
      const cdLeft = partyCooldown > 0 ? `Cooldown: <b>${partyCooldown}s</b>` : 'Ready to request';
      const rows = (party.queue||[]).map(item => {
        const id = item.videoId || ''; const votes = item.votes || 0;
        const voted = partyVoted.has(id);
        const canVote = party.settings?.democratic_upvoting !== false || ['dj','co_dj'].includes(partyGuest?.role);
        return `<div class="party-row"><img src="${escapeHtml(item.thumbnail||'')}" alt=""><div><strong>${escapeHtml(item.title||'Untitled')}</strong><small class="who">by ${escapeHtml(item.requested_by||'Guest')}</small></div><button class="vote ${voted?'voted':''}" data-vote="${escapeHtml(id)}" ${canVote?'':'disabled'}>▲ ${votes}</button></div>`;
      }).join('');
      const skipText = party.skip_threshold ? `<div class="party-skip-status">Skip votes: <b>${party.skip_votes || 0}/${party.skip_threshold}</b></div>` : '';
      body.innerHTML = `<div class="party-head"><span class="room">ROOM ${escapeHtml(party.code||'')}</span><span class="cooldown-ring ${partyCooldown>0?'':'idle'}" id="cd-ring">${partyCooldown>0?partyCooldown:''}</span></div><div class="party-status">${quotaText} · ${cdLeft}${skipText}</div>${rows || '<div class="empty">No requests yet — add the first song.</div>'}`;
      body.querySelectorAll('[data-vote]').forEach(button => button.addEventListener('click', () => voteTrack(button.dataset.vote)));
    }
    function renderPartySearch(results, appended) {
      const list = document.getElementById('party-results');
      if (!list) return;
      const used = party?.unplayed_count || 0; const quota = party?.quota;
      const blocked = (quota && used >= quota) || partyCooldown > 0 || partyGuest?.role === 'muted';
      list.innerHTML = (results||[]).map(item => `<button class="search-result ${(appended||[]).includes(item.videoId)?'added':''}" data-add="${escapeHtml(item.videoId)}" ${blocked?'disabled':''}><img src="${escapeHtml(item.thumbnail||'')}" alt=""><span><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.artist||'')}</small></span></button>`).join('') || '<div class="empty">No songs found.</div>';
      list.querySelectorAll('[data-add]').forEach(button => button.addEventListener('click', () => requestTrack(button.dataset.add)));
    }
    async function joinParty(code, name) {
      try {
        const data = await request('/api/party/join', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code, name})});
        partyGuest = { id: data.guest_id, name: data.name, role: 'guest', code };
        localStorage.setItem('myriddim.partyGuest', JSON.stringify(partyGuest));
        party = { active: true, ...party, ...data };
        enterPartyMode();
        showToast(`Joined ${code}`);
      } catch (error) { showToast(error.message || 'Could not join'); }
    }
    function enterPartyMode() {
      document.getElementById('party-tab').hidden = false;
      document.getElementById('party-tab').click();
      if (partyTimer) clearInterval(partyTimer);
      partyTimer = setInterval(partySync, 1500);
    }
    async function partySync() {
      if (!partyGuest) return;
      try {
        const response = await fetch(`${base}/api/party/queue?code=${encodeURIComponent(partyGuest.code)}&guest_id=${encodeURIComponent(partyGuest.id)}`);
        if (response.status === 401) {  // kicked or room closed: drop the session
          localStorage.removeItem('myriddim.partyGuest'); partyGuest = null; party = null;
          if (partyTimer) { clearInterval(partyTimer); partyTimer = null; }
          if (activeDrawer === 'party' || activeDrawer === 'search') renderPartySearchView();
          showToast('You were removed from the party');
          return;
        }
        if (!response.ok) return;
        const data = await response.json();
        party = { ...party, ...data };
        if (data.guest?.role) partyGuest.role = data.guest.role;
        if (typeof data.remaining_cooldown === 'number') setCooldown(data.remaining_cooldown);
        const activeId = data.active_track?.videoId || null;
        if (partySkipFor !== activeId) { partySkipFor = activeId; partySkipVoted = false; }
        if (activeDrawer === 'party') renderParty();
        if (activeDrawer === 'party') renderPartySearch(window.__partySearchResults || [], window.__partyAdded);
      } catch { /* offline */ }
    }
    async function voteTrack(videoId) {
      if (!partyGuest || !videoId) return;
      try {
        const data = await request('/api/party/vote', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code: partyGuest.code, guest_id: partyGuest.id, video_id: videoId})});
        if (data.votes !== undefined) { partyVoted.has(videoId) ? partyVoted.delete(videoId) : partyVoted.add(videoId); }
        party = { ...party, ...data }; renderParty();
      } catch (error) { showToast(error.message || 'Vote failed'); }
    }
    async function requestTrack(videoId, playNext = partyPlayNext) {
      if (!partyGuest) return;
      const item = (window.__partySearchResults||[]).find(track => (track.videoId||track.id) === videoId);
      if (!item) return;
      try {
        const data = await request('/api/party/request', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code: partyGuest.code, guest_id: partyGuest.id, track: {...item, play_next: !!playNext}})});
        window.__partyAdded = [...(window.__partyAdded||[]), videoId];
        if (typeof data.remaining_cooldown === 'number') startCooldown(data.remaining_cooldown || 30);
        const pending = data.entry?.status === 'pending';
        showToast(pending ? 'Sent to host for approval' : `Added to queue`);
        party = { ...party, ...data }; renderPartySearch(window.__partySearchResults||[], window.__partyAdded); if (activeDrawer === 'party') renderParty();
      } catch (error) {
        const message = error && error.message ? error.message : 'Request failed';
        showToast(/cooldown/i.test(message) ? message : (message || 'Request failed'));
      }
    }
    async function voteSkip() {
      if (!partyGuest || !party?.active_track?.videoId) return;
      try {
        const data = await request('/api/party/skip', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code: partyGuest.code, guest_id: partyGuest.id})});
        partySkipVoted = !!data.skip_requested || (Number(data.votes) > 0 && Number(data.votes) >= Number(data.threshold));
        party = { ...party, ...data };
        render();
        showToast(data.skip_requested ? 'Skip threshold reached' : `Skip vote ${data.votes}/${data.threshold}`);
      } catch (error) { showToast(error.message || 'Skip vote failed'); }
    }
    function openPartyJoin(code) {
      const overlay = document.getElementById('join-overlay');
      document.getElementById('join-room').textContent = `Room ${code}`;
      overlay.hidden = false;
      document.getElementById('join-go').onclick = () => {
        const name = document.getElementById('join-name').value.trim() || 'Guest';
        overlay.hidden = true;
        joinParty(code, name);
      };
      document.getElementById('join-name').focus();
    }
    try {
      (function initParty() {
        const fromLink = partyParams();
        const saved = (() => { try { return JSON.parse(localStorage.getItem('myriddim.partyGuest')||'null'); } catch { return null; } })();
        if (fromLink) { openPartyJoin(fromLink); }
        else if (saved && saved.code && saved.id) {
          partyGuest = saved;
          party = { active: true, code: saved.code };
          enterPartyMode();
          partySync();
        }
      })();
    } catch (error) { showConnectionError(); }
  </script>
</body>
</html>
