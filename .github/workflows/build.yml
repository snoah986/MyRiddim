name: Cloud Build EXE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Freeze Python Backend Sidecar
        shell: pwsh
        run: |
          pip install -r backend/requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name "ytm-backend-x86_64-pc-windows-msvc" backend/app.py
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          Copy-Item "dist/ytm-backend-x86_64-pc-windows-msvc.exe" "src-tauri/binaries/ytm-backend-x86_64-pc-windows-msvc.exe"

      - name: Install Node Dependencies
        run: npm install

      # CI has no TAURI_SIGNING_PRIVATE_KEY, and createUpdaterArtifacts: true
      # makes the bundler sign updater artifacts (signing fails without a key).
      # The overlay disables just that for this unsigned installer build.
      - name: Build Tauri App
        run: npm run tauri build -- --config src-tauri/tauri.ci.conf.json --bundles nsis

      - name: Upload Finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: myriddim-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
