name: Dependency Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/requirements.txt"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/requirements.txt"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Node dependencies and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pip-audit
      - run: pip-audit -r backend/requirements.txt
      - run: python -m py_compile backend/app.py backend/lyrics_yrc.py

  rust:
    name: Rust dependency audit and check
    # Tauri 2's Linux crates need webkit2gtk/gtk headers; ubuntu-22.04 still
    # ships the libappindicator3-dev name the rest of the matrix expects.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      # tauri-build validates bundle.externalBin for the target triple while
      # `cargo check` runs its build script. The real sidecar is only produced
      # for packaged builds (and src-tauri/binaries is gitignored), so a stub
      # with the expected triple-named filename keeps this check green.
      - name: Stub sidecar for tauri-build validation
        run: |
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > src-tauri/binaries/ytm-backend-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ytm-backend-x86_64-unknown-linux-gnu
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
