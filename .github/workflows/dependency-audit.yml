name: Dependency Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/requirements.txt"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/requirements.txt"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Node dependencies and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pip-audit
      - run: pip-audit -r backend/requirements.txt
      - run: python -m py_compile backend/app.py backend/lyrics_yrc.py

  rust:
    name: Rust dependency audit and check
    # Tauri 2's Linux crates need webkit2gtk/gtk headers; ubuntu-22.04 still
    # ships the libappindicator3-dev name the rest of the matrix expects.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
