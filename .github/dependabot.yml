version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated

  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
